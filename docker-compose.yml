# Sobe a API e o n8n juntos: docker compose up
# Depois importe n8n/balcao-workflow.json em http://localhost:5678 (veja n8n/README.md).
services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      BALCAO_DATABASE: /data/balcao.db
      BALCAO_ADMIN_TOKEN: ${BALCAO_ADMIN_TOKEN:?defina no .env}
      BALCAO_N8N_SECRET: ${BALCAO_N8N_SECRET:?defina no .env}
      BALCAO_N8N_WEBHOOK_URL: http://n8n:5678/webhook/balcao
    volumes:
      - balcao_data:/data
    depends_on:
      - n8n

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - '5678:5678'
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      # Os nós de código usam o módulo crypto e leem variáveis de ambiente.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      BALCAO_N8N_SECRET: ${BALCAO_N8N_SECRET}
      BALCAO_API_URL: http://api:3000
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  balcao_data:
  n8n_data:
