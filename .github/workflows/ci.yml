name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Fluxo do n8n está em dia com scripts/build-workflow.mjs
        run: npm run build:workflow && git diff --exit-code n8n/
      - run: npm run build
